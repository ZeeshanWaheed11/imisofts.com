# Applies site patches uploaded to ops/patches/ (added 2026-09-28).
# Why: a change that spans many folders cannot be committed in one go through the
# GitHub web upload, so the diff is uploaded as one .patch file and this job applies it.
# Safe by design: "git apply --check" fails the run without touching anything if any
# target file changed since the patch was made. Each patch file is removed after use.
name: Apply site patch
on:
  push:
    branches: [main]
    paths:
      - 'ops/patches/*.patch'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-site-patch
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check, then apply every patch in ops/patches
        run: |
          shopt -s nullglob
          files=(ops/patches/*.patch)
          if [ ${#files[@]} -eq 0 ]; then echo "No patches."; exit 0; fi
          for p in "${files[@]}"; do echo "Checking $p"; git apply --check "$p"; done
          for p in "${files[@]}"; do echo "Applying $p"; git apply "$p"; git rm -qf "$p"; done
          echo "NAMES=$(basename -a "${files[@]}" | tr '\n' ' ')" >> "$GITHUB_ENV"
      - name: Commit
        run: |
          git config user.name "imisofts-nav-bot"
          git config user.email "nav-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "site: apply ${NAMES}"
            git push
          fi
