# Adds Cloudflare Pages Functions under functions/api/tools/ (page reader and link checker) and the
# browser script assets/tools/free-tools-1.0.0.js. Only /api/tools/* runs code; static pages are untouched.
# Also keeps /functions/* out of public reach like /ops/*. Idempotent: a re-run changes nothing.
