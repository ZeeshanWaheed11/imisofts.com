      - name: Commit
        run: |
          git config user.name "imisofts-tools-bot"
          git config user.email "tools-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "tools: AI writing tools backend (/api/tools/write) and writing-tools-1.0.0.js"
            git pull --rebase origin main
            git push
          fi
