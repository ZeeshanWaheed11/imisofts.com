      - name: Footer link, sitemap and llms list
        run: |
          python3 - <<'PY'
          import re, os, json, subprocess
          TODAY = '2026-11-08'
          NEW = ['/free-seo-tools', '/broken-link-checker', '/xml-sitemap-generator', '/website-change-monitor']
          LI = '<li><a href="/free-seo-tools">Free SEO Tools</a></li>'
          ANCHOR = re.compile(r'(\n[ \t]*)<li><a href="/send-to-webhook">Send to Webhook</a></li>')

          def footer():
              files = subprocess.run(['git', 'ls-files', '*.html'], capture_output=True, text=True).stdout.split()
              changed = 0
              for rel in files:
                  raw = open(rel, 'rb').read()
                  try:
                      s = raw.decode('utf-8')
                  except UnicodeDecodeError:
                      continue
                  fm = re.search(r'<footer.*?</footer>', s, re.S)
                  if not fm or 'href="/free-seo-tools"' in fm.group(0):
                      continue
                  f = fm.group(0)
                  m = ANCHOR.search(f)
                  if not m:
                      continue
                  f2 = f[:m.end()] + m.group(1) + LI + f[m.end():]
                  s = s.replace(f, f2, 1)
                  open(rel, 'wb').write(s.encode('utf-8'))
                  changed += 1
              print('footer: %d pages got the Free SEO Tools link' % changed)

          def sitemap():
              p = 'sitemap.xml'
              x = open(p, encoding='utf-8').read(); x0 = x
              for u in NEW:
                  loc = 'https://imisofts.com' + u
                  if '<loc>%s</loc>' % loc in x:
                      continue
                  x = x.replace('</urlset>', '<url>\n<loc>%s</loc>\n<lastmod>%s</lastmod>\n<changefreq>monthly</changefreq>\n<priority>0.8</priority>\n</url>\n</urlset>' % (loc, TODAY), 1)
              if x != x0:
                  open(p, 'w', encoding='utf-8').write(x)
              print('sitemap:', 'updated' if x != x0 else 'unchanged')

          def llms_group():
              p = 'ops/build_llms.py'
              s = open(p, encoding='utf-8').read()
              if "'/broken-link-checker'" in s:
                  print('build_llms: already lists the tools'); return
              old = "        '/dns-propagation-checker', '/spf-dkim-dmarc-checker', '/send-to-webhook',\n"
              if s.count(old) != 1:
                  raise SystemExit('build_llms anchor not found')
              s = s.replace(old, old + "        '/free-seo-tools', '/broken-link-checker', '/xml-sitemap-generator', '/website-change-monitor',\n", 1)
              open(p, 'w', encoding='utf-8').write(s)
              print('build_llms: added the 4 tool pages to Free tools')

          missing = [u for u in NEW if not os.path.exists(u.lstrip('/') + '.html')]
          if missing:
              raise SystemExit('pages not in the repo yet: %s' % missing)
          footer(); sitemap(); llms_group()
          json.dump(['https://imisofts.com' + u for u in NEW], open(os.environ.get('INDEXNOW_QUEUE', '/tmp/indexnow_queue.json'), 'w'))
          PY
      - name: Regenerate llms.txt and llms-full.txt
        run: python3 ops/build_llms.py
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "imisofts-tools-bot"
          git config user.email "tools-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "tools: Free SEO Tools in the footer, 4 tool pages in sitemap.xml and llms.txt, page reader entity fix (owner request 2026-11-08)"
            git pull --rebase origin main
            git push
          fi
      - name: Ping IndexNow once the pages are live
        run: python3 ops/indexnow_after_deploy.py
        continue-on-error: true
        timeout-minutes: 20
