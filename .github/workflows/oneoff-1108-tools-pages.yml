# One-off, 2026-11-08 (owner: "Get everything done"): publish the first free SEO tools.
# Pages /free-seo-tools, /broken-link-checker, /xml-sitemap-generator, /website-change-monitor are uploaded
# before this runs. This adds "Free SEO Tools" to the footer Resources column, the 4 URLs to sitemap.xml and
# to ops/build_llms.py (then llms.txt is regenerated), refreshes the page reader function (more HTML entities)
# and the tool script, then pings IndexNow. Only adds; idempotent.
name: One-off 2026-11-08 free tools pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-1108-tools-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
