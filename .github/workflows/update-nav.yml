# Site-wide navigation maintenance.
#   1. inject_nav.py      adds any new service pages to the mega-menu, mobile menu and footer
#   2. restructure_nav.py sorts them into balanced categories so no panel overflows the screen
# Both are additive and idempotent, so this is safe to re-run at any time.
name: Update nav
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/inject_nav.py'
      - 'ops/restructure_nav.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inject service links into nav and footer
        run: python3 ops/inject_nav.py
      - name: Sort nav into balanced categories
        run: python3 ops/restructure_nav.py
      - name: Commit generated files
        run: |
          git config user.name "imisofts-nav-bot"
          git config user.email "nav-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No nav changes to commit."
          else
            git commit -m "build: update site-wide nav categories"
            git push
          fi
