# Adds new service pages to the site-wide nav (desktop mega-menu, mobile menu, footer).
# Additive and idempotent, so it is safe to re-run. Trigger manually from the Actions tab.
name: Update nav
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/inject_nav.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inject service links into nav and footer
        run: python3 ops/inject_nav.py
      - name: Commit generated files
        run: |
          git config user.name "imisofts-nav-bot"
          git config user.email "nav-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No nav changes to commit."
          else
            git commit -m "build: add service pages to site-wide nav and footer"
            git push
          fi
