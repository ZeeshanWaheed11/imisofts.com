name: Publish byline
on:
  push:
    branches: [main]
    paths:
      - 'content/byline/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wire founder byline article(s) into indexes
        run: python3 ops/build_byline.py
      - name: Commit generated files
        run: |
          git config user.name "imisofts-byline-bot"
          git config user.email "byline-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "build: wire founder byline article(s)"
            git push
          fi
